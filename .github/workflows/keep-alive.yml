name: Keep Render awake

on:
  schedule:
    # Every 10 minutes, 24/7, so the free instance stays warm overnight
    # in America/Bogota as well as during the day.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping HBA backend health
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            "https://hba-backend.onrender.com/health"
